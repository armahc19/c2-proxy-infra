config setup
    uniqueids=no

conn ios-fulltunnel
    keyexchange=ikev2
    left=%defaultroute
    leftcert=server.crt
    leftsendcert=always
    leftsubnet=0.0.0.0/0,::/0
    right=%any
    rightsourceip=10.10.0.0/24
    rightauth=eap-mschapv2
    eap_identity=%any
    auto=add
    dpdaction=restart
    fragmentation=yes
    ike=aes256-sha2-modp2048
    esp=aes256-sha2-modp2048